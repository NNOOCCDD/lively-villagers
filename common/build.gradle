// Loader-neutral code, compiled against vanilla Minecraft with Mojang names. Never shipped on its own:
// the fabric and neoforge projects compile these sources into their jars.
plugins {
	id 'lively-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
}

dependencies {
	compileOnly 'org.spongepowered:mixin:0.8.5'
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
