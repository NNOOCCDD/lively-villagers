// Shared by every subproject: Java 21, repositories, jar naming and metadata expansion.
plugins {
	id 'java-library'
}

base {
	archivesName = "lively-villagers-${project.name}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Sponge'
				url = 'https://repo.spongepowered.org/repository/maven-public'
			}
		}
		filter { includeGroupAndSubgroups('org.spongepowered') }
	}
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_lively-villagers" }
	}
}

processResources {
	var props = [
		'version'                      : version,
		'mod_id'                       : mod_id,
		'mod_name'                     : mod_name,
		'mod_author'                   : mod_author,
		'license'                      : license,
		'description'                  : project.description ?: rootProject.property('description'),
		'minecraft_version'            : minecraft_version,
		'minecraft_version_range'      : minecraft_version_range,
		'fabric_loader_version'        : fabric_loader_version,
		'neoforge_version'             : neoforge_version,
		'neoforge_loader_version_range': neoforge_loader_version_range,
	]
	inputs.properties(props)
	filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
		expand props
	}
}
