plugins {
	id 'lively-loader'
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version

	// Dev runs: -Pselftest, -Praidtest
	runs {
		configureEach {
			systemProperty 'livelyvillagers.debug', 'true'
			if (project.hasProperty('selftest')) {
				systemProperty 'livelyvillagers.selftest', 'true'
			}
			if (project.hasProperty('raidtest')) {
				systemProperty 'livelyvillagers.raidtest', 'true'
			}
		}
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}
