plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			vmArg "-Dlivelyvillagers.debug=true"
			if (project.hasProperty("selftest")) {
				vmArg "-Dlivelyvillagers.selftest=true"
			}
			if (project.hasProperty("film")) {
				vmArg "-Dlivelyvillagers.film=true"
				if (project.hasProperty("filmOnly")) {
					vmArg "-Dlivelyvillagers.film.only=${project.property('filmOnly')}"
					vmArg "-Dlivelyvillagers.film.out=film-retake"
				}
				programArgs "--width", "1920", "--height", "1080", "--username", "Steve"
			}
			if (project.hasProperty("raidtest")) {
				vmArg "-Dlivelyvillagers.raidtest=true"
			}
			if (project.hasProperty("showcase")) {
				vmArg "-Dlivelyvillagers.showcase=true"
				programArgs "--width", "1920", "--height", "1080"
			}
		}
		server {
			vmArg "-Dlivelyvillagers.debug=true"
		}
	}

	mods {
		"livelyvillagers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	// Gradle/Loom itself runs on JDK 25; compile and run the game on Java 21 like real 1.21.1.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Release jars leave out the dev-only tools (self-test, showcase stills, film recorder and its
	// client mixins); dev runs use the class folders and keep them. The lines that register them in
	// fabric.mod.json start with a comma so they can be dropped without breaking the JSON.
	exclude "com/livelyvillagers/dev/**", "livelyvillagers.client.mixins.json"
	filesMatching("fabric.mod.json") {
		filter { line -> (line.contains("SelfTestClient") || line.contains("livelyvillagers.client.mixins.json")) ? null : line }
	}

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

