plugins {
	id 'lively-loader'
	id 'net.fabricmc.fabric-loom-remap'
}

loom {
	splitEnvironmentSourceSets()

	// Dev runs: -Pselftest, -Praidtest, -Pshowcase, -Pfilm [-PfilmOnly=<shot>]
	runs {
		client {
			vmArg "-Dlivelyvillagers.debug=true"
			if (project.hasProperty("selftest")) {
				vmArg "-Dlivelyvillagers.selftest=true"
			}
			if (project.hasProperty("raidtest")) {
				vmArg "-Dlivelyvillagers.raidtest=true"
			}
			if (project.hasProperty("film")) {
				vmArg "-Dlivelyvillagers.film=true"
				if (project.hasProperty("filmOnly")) {
					vmArg "-Dlivelyvillagers.film.only=${project.property('filmOnly')}"
					vmArg "-Dlivelyvillagers.film.out=film-retake"
				}
				programArgs "--width", "1920", "--height", "1080", "--username", "Steve"
			}
			if (project.hasProperty("showcase")) {
				vmArg "-Dlivelyvillagers.showcase=true"
				programArgs "--width", "1920", "--height", "1080"
			}
		}
		server {
			vmArg "-Dlivelyvillagers.debug=true"
		}
	}

	mods {
		"livelyvillagers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

jar {
	// The dev client hooks are registered in fabric.mod.json on comma-first lines so a release jar
	// can drop them without breaking the JSON.
	exclude 'livelyvillagers.client.mixins.json'
	filesMatching('fabric.mod.json') {
		filter { line -> (line.contains('SelfTestClient') || line.contains('livelyvillagers.client.mixins.json')) ? null : line }
	}
}
